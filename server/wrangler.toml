name = "unwalked-streets"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Street tiles, one object per tile: v2/14/{x}/{y}.json
[[r2_buckets]]
binding = "TILES"
bucket_name = "unwalked-streets"

# Caps how often one address can make the Worker ask OpenStreetMap for a tile nobody has asked for before.
[[ratelimits]]
name = "FILL_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 40
  period = 60

[vars]
# Shown on /privacy so people can reach a human. Leave empty to print no contact line.
CONTACT_EMAIL = ""

# Tried in order when a tile has to be built.
#
# Only mirrors reachable FROM a Cloudflare Worker belong here. Probed from inside the Worker
# on 21 November 2026: overpass.osm.ch answered in 137 ms, while overpass-api.de,
# overpass.private.coffee and overpass.kumi.systems all timed out, overpass.osm.jp returned
# 530 and maps.mail.ru 504. overpass-api.de answers a laptop in ~29 s, so this is about where
# the request comes from, not the query. A mirror that cannot be reached is not kept as a
# fallback: it would only add its timeout to every failure.
OVERPASS_ENDPOINTS = "https://overpass.osm.ch/api/interpreter"
